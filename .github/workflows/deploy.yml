name: Deploy to GitHub Pages

on:
  push: {}
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Normalize build output to ./dist
        run: |
          # Move common build output folders to ./dist so upload step always finds the site
          if [ -d "build" ]; then rm -rf dist && mv build dist; fi
          if [ -d "out" ]; then rm -rf dist && mv out dist; fi
          if [ ! -d "dist" ]; then echo "No build output found; make sure 'vite build' generated files in ./dist" && exit 1; fi
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
